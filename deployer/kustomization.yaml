# hydra-deployer on hlcluster (PET-102). Never referenced by an Argo CD
# Application: apply by hand with `kubectl --context <hlcluster> apply -k deployer/`.
# The script is packaged as a ConfigMap whose name carries a hash, so a change
# to deployer.py rolls into the next run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests/hlcluster.yaml
configMapGenerator:
  - name: hydra-deployer-script
    namespace: hydra-deployer
    files:
      - deployer.py
