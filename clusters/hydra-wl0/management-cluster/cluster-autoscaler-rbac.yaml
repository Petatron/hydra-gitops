# ############################################################################
# APPLIED TO THE MANAGEMENT CLUSTER, NOT TO hydra-wl0.
#
# Nothing in this directory is synced by Argo CD, and pointing an Application at
# it would be a mistake: these objects belong to the cluster that holds the
# Cluster API objects, which has no Argo CD of its own. Apply by hand:
#
#   kubectl --context <management> apply -f cluster-autoscaler-rbac.yaml
#
# It lives beside the workload manifests anyway, because a reader trying to
# understand how CA reaches two clusters needs both halves in one place, and the
# half that is missing is the half that gets forgotten.
# ############################################################################
#
# This is the identity hydra-wl0's Cluster Autoscaler assumes when it reads and
# scales MachineDeployments. Its token is copied into hydra-wl0, so **anyone
# with access to that cluster holds exactly these permissions here.**
#
# What that does and does not buy, stated plainly rather than optimistically:
#
#   - Reads are CLUSTER-WIDE and cannot be narrowed. Node-group discovery lists
#     and watches across namespaces, and RBAC's resourceNames does not apply to
#     list or watch. So this token can read every Cluster API object on the
#     management cluster, including other clusters'.
#   - Writes are pinned to this cluster's own pool by resourceNames, below.
#   - `--node-group-auto-discovery=...,clusterName=hydra-wl0` on the Deployment
#     is NOT an authorization boundary. It only filters what that process
#     chooses to act on; anyone who copies the token can ignore it. The
#     resourceNames rule is the part that actually constrains a holder.

apiVersion: v1
kind: Namespace
metadata:
  name: cluster-autoscaler-hydra-wl0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler-hydra-wl0
  namespace: cluster-autoscaler-hydra-wl0
---
# Read half: shared, and necessarily cluster-wide.
#
# Discovery lists and watches these kinds across namespaces to find node groups
# and to map Nodes back to Machines. resourceNames cannot restrict list/watch --
# those requests name no resource -- so there is nothing to pin here, and a
# second workload cluster's autoscaler can reuse this same role.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-autoscaler-management-read
rules:
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - machinedeployments
      - machinedeployments/scale
      - machines
      - machinesets
      - machinepools
    verbs:
      - get
      - list
      - watch
---
# Write half: per-cluster, and pinned to the one pool this autoscaler scales.
#
# Deliberately NOT merged into the read role. That one is shared by every
# workload cluster's autoscaler, and resourceNames cannot live in a shared role
# without granting each autoscaler write access to the others' pools.
#
# Three details worth stating, all verified against the 1.35 source rather than
# copied from the upstream example:
#
#  1. Only the `scale` subresource. SetSize patches
#     `Scales(namespace).Patch(gvr, name, ...)` and never writes the
#     MachineDeployment object, so `update` on `machinedeployments` itself would
#     be unused.
#
#  2. `patch` is REQUIRED, and the upstream clusterapi example omits it -- it
#     grants get/list/update/watch only. SetSize issues a MergePatch, and RBAC
#     treats patch and update as different verbs, so the example as published
#     would return 403 at the moment of the first scale-up. That failure would
#     surface during PET-12 as a permissions error at the worst possible time,
#     so both verbs are granted here.
#
#  3. No `update` on machines, machinesets or machinepools in THIS role.
#     Scale-down needs update on machines, and that grant arrived with PET-13
#     -- but it cannot be pinned by resourceNames, so it lives in its own
#     namespaced Role further down, fenced by an admission policy.
#
# Adding a second pool means adding its name below. That is the intended cost:
# the alternative is a token that can scale pools nobody has thought about.
#
# PET-12 paid that cost and it is worth recording what it looks like, because
# the pool is otherwise entirely healthy. `pool-compute` was discovered as a node
# group with the right bounds, its capacity resolved, and CA picked it as the
# expansion option for a pending pod -- then the scale-up itself was refused:
#
#   Node group MachineDeployment/default/pool-compute is not ready for scaleup -
#   backoff with status: failed to increase node group size:
#   machinedeployments.cluster.x-k8s.io "pool-compute" is forbidden: User
#   "system:serviceaccount:cluster-autoscaler-hydra-wl0:cluster-autoscaler-hydra-wl0"
#   cannot patch resource "machinedeployments/scale"
#
# The pod also gets a NotTriggerScaleUp event, but nothing about the pool's own
# status says anything is wrong. A new pool is not scalable until its name is
# here.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-autoscaler-management-scale-hydra-wl0
rules:
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - machinedeployments/scale
    resourceNames:
      - hydra-wl0-md-0
      - pool-compute
    verbs:
      - get
      - patch
      - update
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-autoscaler-management-read-hydra-wl0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler-management-read
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler-hydra-wl0
    namespace: cluster-autoscaler-hydra-wl0
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-autoscaler-management-scale-hydra-wl0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler-management-scale-hydra-wl0
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler-hydra-wl0
    namespace: cluster-autoscaler-hydra-wl0
---
# The fence for the scale-down grant below. It is applied BEFORE the grant --
# kubectl applies in file order -- so the Role never exists unfenced, not even
# for the moment between the two.
#
# Scoped to one ServiceAccount by matchConditions, so Cluster API's
# own controllers and human operators -- which update Machines constantly -- are
# never evaluated by it.
#
# failurePolicy: Fail means an expression that cannot be evaluated refuses the
# update rather than waving it through. For this ServiceAccount that is the
# safe direction: a refused mark leaves the node in place.
#
# `object` here is the post-mutation object, so if a Cluster API defaulting
# webhook ever starts rewriting spec on update, the spec check will refuse CA's
# marks. That would surface as scale-down failing, not as anything unsafe --
# and it is why the policy must be exercised with dry-run updates after every
# apply, before scale-down depends on it. ../cluster-autoscaler/README.md has
# the procedure: one update it must admit, and four it must refuse.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-autoscaler-hydra-wl0-machine-updates
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cluster.x-k8s.io"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["machines"]
  matchConditions:
    - name: hydra-wl0-autoscaler-only
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:cluster-autoscaler-hydra-wl0:cluster-autoscaler-hydra-wl0'
  variables:
    - name: deleteKey
      expression: "'cluster.x-k8s.io/delete-machine'"
    - name: oldAnn
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    - name: newAnn
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: oldLabels
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: newLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: "oldObject.spec.clusterName == 'hydra-wl0'"
      message: "The hydra-wl0 autoscaler may only update Machines that belong to cluster hydra-wl0."
    - expression: "!('cluster.x-k8s.io/control-plane' in variables.oldLabels)"
      message: "The hydra-wl0 autoscaler may not update control-plane Machines."
    - expression: "object.spec == oldObject.spec"
      message: "The hydra-wl0 autoscaler may not change a Machine's spec."
    - expression: "variables.newLabels == variables.oldLabels"
      message: "The hydra-wl0 autoscaler may not change a Machine's labels."
    - expression: >-
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) ==
        (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : [])
      message: "The hydra-wl0 autoscaler may not change a Machine's finalizers."
    - expression: >-
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) ==
        (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
      message: "The hydra-wl0 autoscaler may not change a Machine's ownerReferences."
    - expression: >-
        variables.newAnn.all(k, k == variables.deleteKey ||
          (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k == variables.deleteKey || k in variables.newAnn)
      message: "The hydra-wl0 autoscaler may only add or remove the cluster.x-k8s.io/delete-machine annotation."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cluster-autoscaler-hydra-wl0-machine-updates
spec:
  policyName: cluster-autoscaler-hydra-wl0-machine-updates
  validationActions:
    - Deny
---
# Scale-down (PET-13): update on Machines, fenced by the admission policy above.
#
# CA removes a node by marking its Machine and then lowering the pool's replica
# count; Cluster API does the draining and the deleting. Verified against the
# 1.35.2 source: MarkMachineForDeletion does a direct Get -- already granted by
# the read role -- then an Update that sets exactly one annotation,
# cluster.x-k8s.io/delete-machine, to time.Now().String(). Unmarking removes it
# the same way. Lowering replicas is the scale patch already pinned above.
#
# This grant CANNOT be pinned by resourceNames the way the scale patch is.
# Machine names are generated (pool-compute-7swj7-h4qzg), so there is no list
# to write down. Unfenced, update on machines in `default` would cover every
# Machine there -- including the management cluster's own (cluster `hydra`) and
# hydra-wl0's three control-plane Machines -- and `update` can rewrite any
# mutable field, not just an annotation.
#
# So two fences, and both are needed:
#
#   1. A namespaced Role, not a ClusterRole. Discovery is namespace=default, so
#      the grant stops at that namespace.
#   2. The ValidatingAdmissionPolicy above. It admits this ServiceAccount's
#      Machine updates only when the Machine belongs to hydra-wl0, is not a
#      control-plane Machine, and nothing changes except the delete-machine
#      annotation. RBAC answers "may this verb touch this kind at all"; the
#      policy answers "is this the one change CA actually makes". For the scale
#      subresource resourceNames did both jobs; for Machines it takes two.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-autoscaler-management-scaledown-hydra-wl0
  namespace: default
rules:
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - machines
    verbs:
      - update
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-autoscaler-management-scaledown-hydra-wl0
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler-management-scaledown-hydra-wl0
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler-hydra-wl0
    namespace: cluster-autoscaler-hydra-wl0
---
# Scale-from-zero. With a MachineDeployment at zero replicas there is no Node to
# inspect, so CA sizes the pool from HydraMachineTemplate.status.capacity -- and
# it reads that with a dynamic client that lists and watches, not a plain get.
#
# The ClusterRole referenced here is shipped by cluster-api-provider-hydra
# (config/rbac/cluster_autoscaler_role.yaml, PET-27) and intentionally left
# unbound, because the provider cannot know which ServiceAccount will need it.
# This is that binding. The prefixed name is what the provider's kustomize
# overlay actually renders; the unprefixed name does not exist on the cluster.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-autoscaler-hydramachinetemplates-hydra-wl0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-api-provider-hydra-hydramachinetemplate-autoscaler-role
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler-hydra-wl0
    namespace: cluster-autoscaler-hydra-wl0
---
# A long-lived token for the ServiceAccount above.
#
# Kubernetes 1.24 stopped auto-creating these, and `kubectl create token` issues
# a short-lived one that would expire under a long-running Deployment with no
# mechanism here to refresh it. So the Secret is requested explicitly.
#
# It is populated asynchronously by the token controller: `kubectl apply` of
# this Secret returns before `.data.token` exists, so anything reading the token
# must wait for it first. See ../cluster-autoscaler/README.md, which does.
#
# This is the credential that ends up inside the workload cluster. Rotating it
# is a real task, not a someday.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-autoscaler-hydra-wl0-token
  namespace: cluster-autoscaler-hydra-wl0
  annotations:
    kubernetes.io/service-account.name: cluster-autoscaler-hydra-wl0
type: kubernetes.io/service-account-token
