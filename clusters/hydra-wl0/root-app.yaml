apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hydra-wl0-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Petatron/hydra-gitops.git
    targetRevision: main
    path: clusters/hydra-wl0/apps
    directory:
      recurse: false
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
