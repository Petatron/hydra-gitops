# hydra-mgmt, the self-hosted management cluster, as the `hydra` CLI describes
# it (PET-96). Nothing in this repository reconciles it: hydra-mgmt has no
# Argo CD. The CLI applies it to hydra-mgmt itself, for example
#   hydra cluster plan -f clusters/hydra-mgmt/hydra.yaml --management-kubeconfig <hydra-mgmt kubeconfig>
# Values are this site's (the reference lab), not defaults.
#
# Cilium is hydra's (cni: hydra, PET-101): a HelmChartProxy that Cluster API
# Add-on Provider Helm, running on hydra-mgmt itself, reconciles from Hydra's
# canonical values at ciliumVersion. It took over the Helm release `cilium`
# (from `cilium install`, moved to the canonical values in PET-94); the first
# apply needed --adopt-cni, since the cluster was already running. Never set
# cni: external here: dropping the Cluster's CNI label uninstalls Cilium, and
# hydra refuses it.
apiVersion: hydra.io/v1alpha1
kind: ClusterConfig
metadata:
  name: hydra-mgmt
spec:
  kubernetesVersion: v1.35.3
  storagePool: k8s-workers
  image:
    name: ubuntu-24.04-server-cloudimg-amd64.img
  network:
    controlPlaneEndpoint: 192.168.15.11
    bridges: [br0]
    podCIDR: 10.244.0.0/16
    cni: hydra
    ciliumVersion: 1.19.1
    mtu: 1500
  controlPlane:
    replicas: 3
    vcpus: 2
    memory: 6Gi
    diskSize: 40Gi
