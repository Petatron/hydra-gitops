name: Lab connectivity (no credentials)

# PET-102, step 1 of the deploy workflow: before any SSH key or Kubernetes
# credential exists, prove what a GitHub-hosted runner can reach once it joins
# the tailnet with the Tailscale OIDC federated identity:
#   - the bastion's SSH port answers (the only thing tag:git-ci may reach);
#   - every target in LAB_MUST_NOT_REACH does not;
#   - the runner's node is ephemeral and is logged out when the job ends.
# It holds no secret: the federated identity needs none, and nothing here logs
# in to the bastion. Lab-specific names live in the environment's variables,
# not in this public repository.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lab-connectivity
  cancel-in-progress: false

jobs:
  connectivity:
    name: Tailnet reachability from a hosted runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The federated identity trusts only this environment's OIDC subject
    # (repo:Petatron/hydra-gitops:environment:lab), and the environment allows
    # only main.
    environment: lab
    permissions:
      id-token: write # the Tailscale action exchanges GitHub's OIDC token
    env:
      BASTION: ${{ vars.LAB_BASTION }}
      MUST_NOT_REACH: ${{ vars.LAB_MUST_NOT_REACH }}
    steps:
      - name: Check the environment's variables
        run: |
          missing=()
          for v in TS_OIDC_CLIENT_ID TS_OIDC_AUDIENCE LAB_BASTION LAB_MUST_NOT_REACH; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::set these variables on the 'lab' environment: ${missing[*]}"
            exit 1
          fi
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
          LAB_BASTION: ${{ vars.LAB_BASTION }}
          LAB_MUST_NOT_REACH: ${{ vars.LAB_MUST_NOT_REACH }}

      - name: Join the tailnet (ephemeral, tag:git-ci)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:git-ci
          hostname: gha-lab-${{ github.run_id }}-${{ github.run_attempt }}
          version: '1.104.7'
          sha256sum: e56693ff74a64f2591b7e819c280635a100aae1ddfb0ef058fcd052b7cd8d16c
          use-cache: 'false'
          ping: ${{ vars.LAB_BASTION }}

      - name: This node
        run: |
          tailscale status --self --peers=false --json \
            | jq '{hostname: .Self.HostName, tags: .Self.Tags, ips: .Self.TailscaleIPs, online: .Self.Online}'
          # The node must carry only the federated identity's tag.
          tailscale status --self --peers=false --json | jq -e '.Self.Tags == ["tag:git-ci"]' >/dev/null \
            || { echo "::error::this node is not tagged exactly tag:git-ci"; exit 1; }

      - name: Reachability
        run: |
          # open HOST PORT: 0 when a TCP connection is accepted within 5s.
          open() { timeout 5 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }
          fail=0
          {
            echo "| Target | Expected | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # Allowed: the bastion's SSH. Read its banner only; never log in.
          if banner=$(timeout 5 bash -c "exec 3<>/dev/tcp/$BASTION/22 && head -c 255 <&3 | head -n1" 2>/dev/null) \
              && [[ "$banner" == SSH-2.0-* ]]; then
            echo "| \`bastion:22\` | open | open (${banner%%$'\r'}) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| \`bastion:22\` | open | **closed** |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the bastion's SSH port is not reachable"
            fail=1
          fi

          # Denied: everything else listed, including other ports on the bastion.
          i=0
          for target in $MUST_NOT_REACH; do
            i=$((i + 1))
            host=${target%:*} port=${target##*:}
            # Targets are reported by position, not name, to keep the lab's
            # addresses out of a public run log.
            if open "$host" "$port"; then
              echo "| must-not-reach #$i (port $port) | closed | **open** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::must-not-reach target #$i (port $port) accepted a connection"
              fail=1
            else
              echo "| must-not-reach #$i (port $port) | closed | closed |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$fail"

      # The action's post step logs this node out; as an ephemeral node it is
      # then removed from the tailnet. Check from a tailnet peer afterwards:
      #   tailscale status | grep gha-lab-<run id>   (must print nothing)
