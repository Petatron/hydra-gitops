name: Lab connectivity (no credentials)

# PET-102, step 1 of the deploy workflow: before any Kubernetes credential
# exists, prove what a GitHub-hosted runner can reach once it joins the tailnet
# with the Tailscale OIDC federated identity:
#   - every target in LAB_MUST_REACH accepts a TCP connection (the management
#     API, through a subnet route that only tag:git-ci may use, port 6443 only);
#   - every target in LAB_MUST_NOT_REACH does not;
#   - the runner's node is ephemeral and is logged out when the job ends.
# It holds no credential: the federated identity needs none, and nothing here
# logs in anywhere. The lab-specific values (client ID, audience and the two
# target lists) are not credentials either, but
# they are stored as environment *secrets*: this repository is public, so are
# its run logs, and GitHub masks secrets in them where it prints variables
# (including every step's `with:` and `env:`).

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lab-connectivity
  cancel-in-progress: false

jobs:
  connectivity:
    name: Tailnet reachability from a hosted runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The federated identity trusts only this environment's OIDC subject
    # (repo:Petatron/hydra-gitops:environment:lab-deploy), and the environment allows
    # only main.
    environment: lab-deploy
    permissions:
      id-token: write # the Tailscale action exchanges GitHub's OIDC token
    env:
      MUST_REACH: ${{ secrets.LAB_MUST_REACH }}
      MUST_NOT_REACH: ${{ secrets.LAB_MUST_NOT_REACH }}
    steps:
      - name: Check the environment's secrets
        run: |
          missing=()
          for v in TS_OIDC_CLIENT_ID TS_OIDC_AUDIENCE LAB_MUST_REACH LAB_MUST_NOT_REACH; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::set these secrets on the 'lab-deploy' environment: ${missing[*]}"
            exit 1
          fi
        env:
          TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
          LAB_MUST_REACH: ${{ secrets.LAB_MUST_REACH }}
          LAB_MUST_NOT_REACH: ${{ secrets.LAB_MUST_NOT_REACH }}

      - name: Join the tailnet (ephemeral, tag:git-ci)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:git-ci
          hostname: gha-lab-${{ github.run_id }}-${{ github.run_attempt }}
          version: '1.104.7'
          sha256sum: e56693ff74a64f2591b7e819c280635a100aae1ddfb0ef058fcd052b7cd8d16c
          use-cache: 'false'
          # No `ping:` here: its output names lab hosts and their tailnet IPs,
          # which masking a secret's exact value would not hide.

      - name: This node
        run: |
          tailscale status --self --peers=false --json \
            | jq '{hostname: .Self.HostName, tags: .Self.Tags, ips: .Self.TailscaleIPs, online: .Self.Online}'
          # The node must carry only the federated identity's tag.
          tailscale status --self --peers=false --json | jq -e '.Self.Tags == ["tag:git-ci"]' >/dev/null \
            || { echo "::error::this node is not tagged exactly tag:git-ci"; exit 1; }

      - name: Reachability
        run: |
          # open HOST PORT: 0 when a TCP connection is accepted within 5s.
          open() { timeout 5 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }
          fail=0
          {
            echo "| Target | Expected | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # Allowed: each must-reach target. Retry for up to 30s: a new node
          # takes a moment to learn its peers and routes.
          i=0
          for target in $MUST_REACH; do
            i=$((i + 1))
            host=${target%:*} port=${target##*:}
            ok=
            for _ in 1 2 3 4 5 6; do
              open "$host" "$port" && { ok=1; break; }
              sleep 5
            done
            # Reported by position: GitHub masks a secret's whole value, not
            # the parts of it this loop prints.
            if [ -n "$ok" ]; then
              echo "| must-reach #$i (port $port) | open | open |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| must-reach #$i (port $port) | open | **closed** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::must-reach target #$i (port $port) did not accept a connection"
              fail=1
            fi
          done

          # Denied: everything else listed, including other ports on the same
          # hosts.
          i=0
          for target in $MUST_NOT_REACH; do
            i=$((i + 1))
            host=${target%:*} port=${target##*:}
            if open "$host" "$port"; then
              echo "| must-not-reach #$i (port $port) | closed | **open** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::must-not-reach target #$i (port $port) accepted a connection"
              fail=1
            else
              echo "| must-not-reach #$i (port $port) | closed | closed |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$fail"

      # The action's post step logs this node out; as an ephemeral node it is
      # then removed from the tailnet. Check from a tailnet peer afterwards:
      #   tailscale status | grep gha-lab-<run id>   (must print nothing)
