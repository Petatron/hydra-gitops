name: Validate GitOps

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: GitOps validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned validators
        run: |
          python -m pip install -r scripts/ci/requirements.txt
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflow
        run: actionlint
      - name: Prove validation rejects broken inputs
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Validate repository and Kustomize output
        run: python scripts/ci/validate.py
