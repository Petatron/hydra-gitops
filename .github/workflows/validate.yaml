name: Validate GitOps

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request's run is wanted; superseding main's is not.
  # Argo CD reconciles main with automated sync regardless of CI, so cancelling
  # a merged commit's validation lets an unchecked commit reach both clusters.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: GitOps validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned validators
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements.txt
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflow
        run: actionlint
      - name: Prove validation rejects broken inputs
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Validate repository and Kustomize output
        run: python scripts/ci/validate.py
